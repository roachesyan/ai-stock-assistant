[project]
name = "ai-stock-assistant"
version = "0.1.0"
description = "AI Quant Agent — multi-agent stock analysis with auto-execution and same-day cancellation"
requires-python = ">=3.10"
dependencies = [
    "langgraph>=0.2",
    "langchain>=0.3",
    "langchain-anthropic>=0.2",
    "langchain-openai>=0.2",
    "yfinance>=0.2",
    "tavily-python>=0.5",
    "duckduckgo-search>=6.0",
    "python-dotenv>=1.0",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "aiosqlite>=0.20",
    "pydantic>=2.0",
    "apscheduler>=3.10",
    "pandas-market-calendars>=4.3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
